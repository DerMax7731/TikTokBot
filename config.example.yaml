# Copy to config.yaml and edit. Secrets can also come from the environment:
# TIKTOK_CLIENT_KEY / TIKTOK_CLIENT_SECRET.

tiktok:
  client_key: ""
  client_secret: ""
  redirect_uri: "https://example.com/callback"   # must match your TikTok developer app
  # PUBLIC_TO_EVERYONE | MUTUAL_FOLLOW_FRIENDS | FOLLOWER_OF_CREATOR | SELF_ONLY
  # Unaudited TikTok apps may only post SELF_ONLY (private).
  privacy_level: "SELF_ONLY"
  # direct: the bot publishes the post itself.
  # draft:  the clip is sent to your TikTok inbox and you publish it in the app
  #         (works publicly with an unaudited app; needs the app's "Upload to inbox" permission).
  mode: "direct"

schedule:
  timezone: "Europe/Berlin"
  post_times: ["09:00", "15:00", "20:00"]   # 3 posts a day
  grace_minutes: 180                        # a missed slot is still posted this long after

clips:
  length_seconds: 35
  per_source: 3            # best N highlights taken from each video
  min_gap_seconds: 20      # minimum distance between two highlights
  layout: blur             # blur (whole frame on blurred background) | crop (fill screen) | fit (black bars)
                           # smart: fill the screen centred on the speaker's face, blur when no face is found
                           #        (needs `pip install "tiktokbot[vision]"`)
  subtitles: true          # burn in word-by-word captions when a transcript is available
  hook_overlay: true       # show the AI-written headline for the first seconds
  normalize_audio: true    # even out loudness
  candidates_factor: 3     # with AI on, offer it 3x as many moments as needed to choose from
  long_video_minutes: 20   # above this, only the chosen stretches of video are downloaded
  queue_target: 6          # harvest new sources when fewer clips than this are waiting

# Optional: Claude reads the transcripts, picks the strongest moments and writes
# hook, caption and hashtags. Needs `pip install "tiktokbot[ai]"` and ANTHROPIC_API_KEY.
ai:
  enabled: true
  model: "claude-opus-5-5"
  language: ""             # caption language; empty = language spoken in the clip

# Transcripts come from YouTube captions. For Twitch/TikTok/live sources install
# `pip install "tiktokbot[subtitles]"` to transcribe locally with Whisper.
whisper:
  model: "small"

review:
  require_approval: false  # true: clips wait for `tiktokbot approve` before they can be posted

posting:
  max_attempts: 3          # failed uploads are retried, then the clip is dropped
  retry_minutes: 10

notify:
  webhook_url: ""          # Discord or Slack webhook: posted / failed / nothing to post

# Track views and likes of posted clips; sources whose clips do best are harvested first.
# Needs the video.list permission on your TikTok app; run `tiktokbot auth` again after enabling.
stats:
  enabled: false

# Dashboard (`tiktokbot web` or `tiktokbot run --web`).
web:
  host: "127.0.0.1"        # only this machine; to open it to your network use 0.0.0.0 and set a token
  port: 8080
  token: ""                # then open http://<host>:8080/?token=<token>

# Only add content you own or are allowed to re-use (your own channels,
# creators with a clipping policy, licensed material).
sources:
  # A channel/playlist/profile: the newest unseen videos are taken.
  - url: "https://www.youtube.com/@YourChannel/videos"
    latest: 2
    hashtags: ["fyp", "clips"]
  # A single video.
  # - url: "https://www.youtube.com/watch?v=XXXXXXXXXXX"
  # A live stream (Twitch, YouTube Live, Kick ...): records this many seconds when live.
  # - url: "https://www.twitch.tv/yourchannel"
  #   record_seconds: 1200
  # A TikTok profile or video.
  # - url: "https://www.tiktok.com/@youraccount"
  #   latest: 3

caption:
  template: "{title} {hashtags}"
  credit: true             # appends "(via <uploader>)"
  max_length: 2200

paths:
  data_dir: "data"
