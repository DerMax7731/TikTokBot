[project]
name = "tiktokbot"
version = "0.3.0"
description = "Clips highlights from YouTube, live streams and TikTok and posts them to TikTok on a schedule"
requires-python = ">=3.10"
dependencies = ["yt-dlp>=2025.1.1", "requests>=2.31", "PyYAML>=6.0", "numpy>=1.26"]

[project.optional-dependencies]
ai = ["anthropic>=1.0", "pydantic>=2"]
subtitles = ["faster-whisper>=1.0"]
vision = ["opencv-python-headless>=4.8,<5"]
dev = ["pytest"]

[project.scripts]
tiktokbot = "tiktokbot.cli:main"

[tool.setuptools]
packages = ["tiktokbot"]

[tool.setuptools.package-data]
tiktokbot = ["dashboard.html"]
